<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Tareas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/assets/styles.css" />
    <script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="header-inner">
          <div class="brand">
            <div class="brand-logo" aria-hidden="true"></div>
            <div>
              <div class="brand-title">Lista de Tareas</div>
              <div class="brand-sub">CRUD simple y elegante</div>
            </div>
          </div>
          <div class="theme-toggle">
            <span>Modo</span>
            <div class="switch" id="themeSwitch" role="button" aria-label="Cambiar tema" tabindex="0">
              <div class="switch-thumb"></div>
            </div>
          </div>
        </div>
      </header>

      <main class="main">
        <div class="grid-2 card">
          <div class="card-body">
            <div class="card-header">
              <div class="card-title">
                <span class="icon" aria-hidden="true">📝</span>
                Agregar Tarea
              </div>
            </div>
            <div class="list" style="gap: 16px">
              <label class="item" style="grid-template-columns: 1fr;">
                <div class="item-title">Nombre de la tarea</div>
                <input type="text" id="nameTarea" class="input" placeholder="Ej. Lavar el coche" />
              </label>
              <label class="item" style="grid-template-columns: 1fr;">
                <div class="item-title">Descripción</div>
                <textarea id="descripcionTarea" class="input" rows="3" placeholder="Escribe una breve descripción"></textarea>
              </label>
              <div class="controls">
                <button type="submit" id="button-form" class="btn btn-primary">Crear</button>
                <button style="display:none" id="button-actualizar" onclick="actualizarDatos()" class="btn btn-primary">Actualizar</button>
                <button class="btn btn-ghost" id="limpiarCampos">Limpiar</button>
              </div>
            </div>
          </div>

          <div class="card-body">
            <div class="card-header">
              <div class="card-title">
                <span class="icon" aria-hidden="true">📋</span>
                Lista de Tareas
              </div>
            </div>
            <div class="separator"></div>
            <div class="card" style="background: transparent; box-shadow: none; border: none;">
              <table class="table" style="width: 100%; color: var(--text);">
                <thead>
                  <tr id="miapp">
                    <th scope="col">N°</th>
                    <th scope="col">Nombre</th>
                    <th scope="col">Descripción</th>
                    <th scope="col">Estado</th>
                    <th scope="col">Editar</th>
                    <th scope="col">Eliminar</th>
                  </tr>
                </thead>
                <tbody id="contenido"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>

      <footer class="footer">
        <div class="footer-inner">Hecho con cariño — iwinser117</div>
      </footer>
    </div>
    <script type="module" src="./src/ftn/metods.js"></script>
    <script>
      // Theme toggle
      const switchEl = document.getElementById('themeSwitch');
      const root = document.documentElement;
      const setTheme = (mode) => {
        if (mode === 'light') root.classList.add('light');
        else root.classList.remove('light');
        localStorage.setItem('theme', mode);
      };
      const saved = localStorage.getItem('theme') || 'dark';
      setTheme(saved);
      const toggle = () => setTheme(root.classList.contains('light') ? 'dark' : 'light');
      switchEl.addEventListener('click', toggle);
      switchEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });

      // Optional: limpiar campos
      const limpiarBtn = document.getElementById('limpiarCampos');
      if (limpiarBtn) {
        limpiarBtn.addEventListener('click', () => {
          const name = document.getElementById('nameTarea');
          const desc = document.getElementById('descripcionTarea');
          if (name) name.value = '';
          if (desc) desc.value = '';
        });
      }
    </script>
  </body>
</html>
